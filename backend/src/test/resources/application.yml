spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

kakao:
  rest-api-key: test-key
  local-api-base-url: https://dapi.kakao.com/v2/local
  walk-api-base-url: https://dapi.kakao.com/v2/routing/walk
  oauth:
    redirect-uri: http://localhost:8080/api/auth/kakao/callback

cors:
  allowed-origins: http://localhost:5173

app:
  frontend-base-url: http://localhost:5173

jwt:
  secret: test-jwt-secret-key-for-unit-tests-only-32-bytes-min
  expiration-seconds: 604800
